<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Master Calculator</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/forge.css">
</head>

<body>

    <main class="container">

        <button class="back-btn" onclick="location.href='index.html'">
            ← Home
        </button>

        <header class="page-header">

            <div class="logo">⚒️</div>

            <h1 class="title">Forge Master</h1>

            <p class="subtitle">
                Forge Ascension Calculator
            </p>

        </header>

        <!-- 계산기 -->

        <section class="calculator">

            <div class="input-group">
                <label for="current-level">현재 레벨</label>
                <select id="current-level"></select>
            </div>

            <div class="input-group">
                <label for="target-level">목표 레벨</label>
                <select id="target-level"></select>
            </div>

            <div class="input-group">
                <label for="time-reduction">시간 감소 (%)</label>
                <input
                    id="time-reduction"
                    type="number"
                    min="0"
                    max="50"
                    value="0">
            </div>

            <div class="input-group">
                <label for="cost-reduction">비용 감소 (%)</label>
                <input
                    id="cost-reduction"
                    type="number"
                    min="0"
                    max="25"
                    value="0">
            </div>

            <button
                class="calc-btn"
                id="calculate-btn">
                계산하기
            </button>

        </section>

        <!-- 결과 -->

        <section class="result-section">

            <h2 class="section-title">계산 결과</h2>

            <div class="result">

                <div class="result-card">

                    <span class="icon">💰</span>

                    <p id="gold-result">0</p>

                    <span class="label">필요 골드</span>

                </div>

                <div class="result-card">

                    <span class="icon">⏱</span>

                    <p id="time-result">0일</p>

                    <span class="label">총 시간</span>

                </div>

                <div class="result-card">

                    <span class="icon">💎</span>

                    <p id="gem-result">0</p>

                    <span class="label">즉시 완료 젬</span>

                </div>

            </div>

        </section>

        <!-- 레벨 데이터 -->

        <section class="level-data">

    <details>

        <summary class="section-title">
            📊 레벨별 데이터 보기
        </summary>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Lv</th>
                        <th>골드</th>
                        <th>시간</th>
                        <th>젬</th>

                        <th>Primitive</th>
                        <th>Medieval</th>
                        <th>Early</th>
                        <th>Modern</th>
                        <th>Space</th>
                        <th>Interstellar</th>
                        <th>Multiverse</th>
                        <th>Quantum</th>
                        <th>Underworld</th>
                        <th>Divine</th>
                    </tr>

                </thead>

                <tbody id="level-table"></tbody>

            </table>

        </div>

    </details>

</section>

    </main>

    <script src="js/forge.js"></script>

</body>

</html>
